<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" role="img" aria-labelledby="title"><title id="title">Road cross-section and placement frontier</title><rect width="900" height="320" rx="18" fill="#121b2d"/><g font-family="system-ui,sans-serif" fill="#e5ecf8" font-size="17"><text x="42" y="42">Cross-section: one block wide</text><rect x="100" y="66" width="65" height="130" fill="#203747" stroke="#67d4c4" stroke-width="2" stroke-dasharray="6 5"/><path d="M100 131H165" stroke="#67d4c4" stroke-dasharray="6 5"/><rect x="100" y="197" width="65" height="65" fill="#d6e4ef"/><text x="190" y="121">Two clear cells</text><text x="190" y="237">Floor</text><text x="426" y="42">Build forward from completed support</text><path d="M400 198H745" stroke="#d6e4ef" stroke-width="20"/><rect x="755" y="188" width="59" height="20" fill="none" stroke="#67d4c4" stroke-width="2" stroke-dasharray="5 4"/><rect x="669" y="121" width="27" height="66" rx="6" fill="#b4a2e2"/><circle cx="682" cy="106" r="12" fill="#b4a2e2"/><path d="M695 152L785 177L775 167M785 177L770 182" stroke="#67d4c4" stroke-width="3" fill="none"/><text x="443" y="243">Completed road</text><text x="709" y="270">Next block</text><text x="42" y="298" font-size="13" fill="#a1b1c6">Conceptual geometry. Each placement still requires a valid stance and click face.</text></g></svg>
