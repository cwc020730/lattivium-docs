<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 720" role="img" aria-labelledby="title">
<title id="title">Shared acquisition for supply and construction</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#64748b"/></marker></defs>
<style>text{font-family:system-ui,sans-serif;fill:#172554;text-anchor:middle;font-size:21px}.name{font-size:22px;font-weight:650}.small{font-size:19px;fill:#334155}.box{fill:#eff6ff;stroke:#93c5fd;stroke-width:2}.shared{fill:#f0fdf4;stroke:#86efac;stroke-width:2}.line{fill:none;stroke:#64748b;stroke-width:2.5;marker-end:url(#arrow)}</style>
<rect x="15" y="10" width="870" height="700" rx="18" fill="#f8fafc"/>
<rect class="box" x="40" y="35" width="380" height="90" rx="12"/>
<text class="name" x="230" y="70">AtlasSupplyTask</text>
<text class="small" x="230" y="103">Schematic demand + Delivery targets</text>
<rect class="box" x="480" y="35" width="380" height="90" rx="12"/>
<text class="name" x="670" y="70">AcquireMaterialsFlow</text>
<text class="small" x="670" y="103">Item demand + Optional return target</text>
<path class="line" d="M230 125V148H450V175"/>
<path class="line" d="M670 125V148H450V175"/>
<rect class="shared" x="100" y="180" width="700" height="90" rx="12"/>
<text class="name" x="450" y="215">AtlasSupplyLoadFlow</text>
<text class="small" x="450" y="248">Atlas stock and recipes → Allocation → Transport preparation</text>
<path class="line" d="M450 270V295"/>
<rect class="shared" x="100" y="300" width="700" height="185" rx="12"/>
<text class="name" x="450" y="335">AcquireProductionFlow</text>
<text class="small" x="450" y="376">CollectSupplyFlow → SupplyStepFlow → SupplySourceFlow</text>
<text class="small" x="450" y="410">Travel, container collection, borrowed-box extraction and return</text>
<text class="small" x="450" y="444">ProduceCarriedMaterialsFlow: Required crafting</text>
<text class="small" x="450" y="473">MaterialLedger: Reservations and quantity settlement</text>
<path class="line" d="M450 485V510H230V540"/>
<path class="line" d="M450 485V510H670V540"/>
<rect class="box" x="40" y="545" width="380" height="90" rx="12"/>
<text class="name" x="230" y="580">Supply delivery</text>
<text class="small" x="230" y="613">Physical transfer → Verification</text>
<rect class="box" x="480" y="545" width="380" height="90" rx="12"/>
<text class="name" x="670" y="580">Materials stay with the Bot</text>
<text class="small" x="670" y="613">Return to target → Caller continues</text>
<text class="small" x="450" y="678">The caller supplies rocket, food and capacity maintenance policies</text>
</svg>
